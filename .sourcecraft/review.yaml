## Правила код-ревью.
##
## Замысел: обычный PR мёржится без человека — иначе автономная работа невозможна в
## принципе, а ревьюером выступает модель. Но правки САМИХ БАРЬЕРОВ человек смотрит
## глазами: это единственное место, где агент меняет не продукт, а условия, в которых
## работает сам. Ошибка здесь не видна по результату — прогон останется зелёным, просто
## проверять станет меньше.

codereview:
    need_ships: 0

    ## Аккаунт один: раннер коммитит под ним же. `ignore_self_ship: true` означало бы
    ## «одобрить не может никто», то есть правки барьеров стали бы невозможны навсегда,
    ## а не подконтрольны. Ship здесь не формальность, а осознанное «я это посмотрел»:
    ## его ставит человек руками, и мёрдж-путь раннера одобрений не выставляет.
    ignore_self_ship: false

    auto_assign: false

    rules:
        - patterns:
              - '.sourcecraft/**' ## политики веток, CI, этот файл
              - 'gate.mts' ## состав гейта: что именно проверяется перед мерджем
              ## Здесь живёт предохранитель побочек (RALPH_NO_SIDE_EFFECTS + общий afterEach).
              ## Без него часть сьюта зелёная по ложной причине: тесты уходят в реальный git,
              ## пишут состояние и однажды подняли настоящий detached-монитор.
              - 'vitest.config.ts'
              - 'shared/side-effect-guard.ts'
              ## Вторая половина того же предохранителя: подключение общего afterEach и
              ## запрет сети. Выхолостить его здесь так же дёшево, как в самом guard'е.
              - 'tests/test-setup.ts'
              ## Барьер публичности: репозиторий открыт, и утечка имени проекта-потребителя
              ## необратима — историю не переписать.
              - 'tests/project-traces.ts'
              - 'tests/project-traces.test.ts'
              ## Барьер переносимости: проектные значения и команды форжа в ядре.
              - 'tests/core-purity.test.ts'
              ## Вторая половина того же барьера: запуск форжа по имени исполненного бинаря.
              ## Ослабь разбор — и имя, собранное в рантайме, снова пройдёт мимо обоих.
              - 'tests/forge-exec-guard.ts'
              ## Его пробы от противного и их фикстура: они же доказывают, что подмена
              ## в test-setup.ts вообще ставится. Убери пробу — гейт останется зелёным,
              ## а барьер может перестать применяться.
              - 'tests/forge-exec-guard.test.ts'
              - 'tests/__fixtures__/assembled-forge-exec.ts'
              ## Барьер чистоты продукта: прогон не пишет под каталог ядра. Ослабь его —
              ## и подмодуль снова станет грязным у каждого потребителя, причём узнается
              ## это на bump gitlink, через день после самой записи.
              - 'tests/product-root-purity.test.ts'
              ## Барьер замкнутости: якорь пути наружу репозитория. Ослабь его — и гейт
              ## снова станет зелёным только там, где рядом лежит дерево потребителя,
              ## а на чистом клоне красным.
              - 'tests/outside-deps.test.ts'
              ## Тот же барьер, второй класс: дефолт, ведущий к GitHub-реализации шва.
              ## Отдельным файлом, потому что ловит то, чего первый не видит по
              ## конструкции — в строке `phaseMergedFn = phaseMerged` слова `gh` нет.
              - 'tests/seam-defaults.test.ts'
              ## Стриппер комментариев: общая деталь ОБОИХ сканов по коду. Сломай его —
              ## и оба ослепнут молча, оставаясь зелёными: скан, который ничего не
              ## находит, выглядит ровно как чистое дерево.
              - 'tests/strip-comments.ts'
              ## Скрипт автозакрытия: он исполняется в CI С ТОКЕНОМ и мутирует карточки.
              ## Правка без одобрения означала бы, что любой смердженный PR получает право
              ## делать токеном что угодно из разрешённого им (ревью). Рядом — его тесты:
              ## выхолостить проверку так же дёшево, как поменять сам код.
              - 'close-merged-issues.mts'
              - 'close-merged-issues.test.mts'
              ## Обвязка сессии: сам хук и точка его подключения. Удали блок `hooks` из
              ## настроек — и хук останется в репозитории нетронутым, просто перестанет
              ## вызываться; защищать одно без другого бессмысленно.
              - '.claude/hooks/**'
              - '.claude/settings.json'
          reviewers:
              usernames:
                  - 'lyapindm'
              assign: 1
              need_ships: 1
              ignore_self_ship: false
