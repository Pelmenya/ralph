## Гейт на входе. Конфигурация действует ИЗ ОСНОВНОЙ ВЕТКИ: правки этого файла начинают
## работать только после слияния, в самом PR они не применяются.
##
## Локально гоняется тем же одним скриптом (`npm run gate`) — отдельного «CI-режима» нет:
## иначе появляется класс отказов «на моей машине зелено».

on:
    pull_request:
        - workflows: [gate]
          filter:
              target_branches: ['main']

    ## Основная ветка проверяется и после слияния: squash-коммит — это новое состояние,
    ## которого не было ни в одном PR.
    push:
        - workflows: [gate, close-issues]
          filter:
              branches: ['main']
          skip_on_pull_request: true

workflows:
    gate:
        tasks:
            - name: gate
              image: docker.io/library/node:24
              cubes:
                  - name: install
                    script:
                        - npm ci

                  ## Один скрипт, а не список кубов: порядок и состав проверок — часть продукта
                  ## и живут в gate.mts. Разложи их здесь по кубам — и появится второй источник
                  ## правды, который разойдётся с локальным прогоном молча.
                  - name: gate
                    script:
                        - npm run gate

    ## Закрытие карточек, названных смердженным PR. Отдельный workflow, а не куб гейта:
    ## он ходит в форж и требует секрета, а гейт обязан гоняться и на PR, где секрета
    ## быть не должно. Связь PR↔задача на площадке карточку не закрывает сама (проверено),
    ## поэтому сделанное иначе висит открытым, пока кто-нибудь не вспомнит.
    close-issues:
        tasks:
            - name: close-issues
              image: docker.io/library/node:24
              env:
                  ## ВНИМАНИЕ: секрет — ПРЕДУСЛОВИЕ, а не опция. Площадка резолвит
                  ## `${{ secrets.… }}` на разборе конфига и, не найдя значения, валит
                  ## ВЕСЬ прогон — вместе с гейтом — ещё до старта задачи (проверено:
                  ## три красных пуша в main с «value 'SOURCECRAFT_TOKEN' not defined
                  ## for value source 'secrets'»). Заводи секрет ДО включения этого
                  ## workflow. Токену нужно право менять статус карточек: токен, который
                  ## умеет только читать и комментировать, доходит до PATCH и падает 403.
                  SOURCECRAFT_TOKEN: ${{ secrets.SOURCECRAFT_TOKEN }}
              cubes:
                  ## Без `npm ci`: скрипт живёт на встроенном стриппинге типов Node 24 и
                  ## не тянет ни одной зависимости. Ставить их ради одного запроса к форжу
                  ## значит платить минутой за каждый мердж.
                  - name: close
                    script:
                        - node close-merged-issues.mts
