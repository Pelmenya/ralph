## Гейт на входе. Конфигурация действует ИЗ ОСНОВНОЙ ВЕТКИ: правки этого файла начинают
## работать только после слияния, в самом PR они не применяются.
##
## Локально гоняется тем же одним скриптом (`npm run gate`) — отдельного «CI-режима» нет:
## иначе появляется класс отказов «на моей машине зелено».

on:
    pull_request:
        - workflows: [gate]
          filter:
              target_branches: ['main']

    ## Основная ветка проверяется и после слияния: squash-коммит — это новое состояние,
    ## которого не было ни в одном PR.
    push:
        - workflows: [gate]
          filter:
              branches: ['main']
          skip_on_pull_request: true

workflows:
    gate:
        tasks:
            - name: gate
              image: docker.io/library/node:24
              cubes:
                  - name: install
                    script:
                        - npm ci

                  ## Один скрипт, а не список кубов: порядок и состав проверок — часть продукта
                  ## и живут в gate.mts. Разложи их здесь по кубам — и появится второй источник
                  ## правды, который разойдётся с локальным прогоном молча.
                  - name: gate
                    script:
                        - npm run gate
