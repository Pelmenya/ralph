## Гейт на входе. Конфигурация действует ИЗ ОСНОВНОЙ ВЕТКИ: правки этого файла начинают
## работать только после слияния, в самом PR они не применяются.
##
## Локально гоняется тем же одним скриптом (`npm run gate`) — отдельного «CI-режима» нет:
## иначе появляется класс отказов «на моей машине зелено».

on:
    pull_request:
        - workflows: [gate]
          filter:
              target_branches: ['main']

    ## На пуш в main — только закрытие карточек, гейта здесь нет. PR мерджатся по одному,
    ## и main между гейтом PR и мерджем не двигается, поэтому дерево squash-коммита
    ## совпадает с проверенным: второй прогон повторял бы тот же набор. Если main ушёл
    ## вперёд, то PR перед мерджем вливает свежий main и проходит гейт заново — эту
    ## проверку держит мердж, а не прогон после него. Порядок обкатан у потребителя.
    ## Гейт здесь идёт в облаке площадки, своего воркера нет, поэтому выигрыш — квота:
    ## по замерам потребителя первый не-PR прогон свежего main стоит ей около 380 с
    ## независимо от длины.
    push:
        - workflows: [close-issues]
          filter:
              branches: ['main']
          skip_on_pull_request: true

workflows:
    gate:
        tasks:
            - name: gate
              image: docker.io/library/node:24
              cubes:
                  ## Устаревший прогон не доезжает до конца (#224). Отмены прошлого прогона
                  ## того же PR у CI площадки нет, поэтому куб сам спрашивает голову PR: коммит
                  ## прогона — её предок, то есть голова ушла вперёд, — следующие кубы
                  ## пропускаются со строкой «устарел, HEAD уже X». Любая неясность — полный
                  ## гейт (решение и его пределы — в докблоке ci-stale-run.mts). Пропуск — только
                  ## по значению в форме sha: куб пишет его всегда (пустым при полном гейте), и
                  ## переменная того же имени, пришедшая мимо него, гейт не снимет. Не записал —
                  ## при такой переменной куб краснеет сам, иначе кубы ниже поверили бы ей. Без
                  ## `npm ci`: скрипт на встроенном стриппинге типов и без зависимостей, как
                  ## close-issues. Условие пропуска у install и gate держать в паре: их
                  ## равенство сверяет ci-stale-run.test.mts.
                  - name: stale-check
                    script:
                        - node ci-stale-run.mts

                  ## Замер (#268) без зависимостей: ресурсы до установки и время npm ci.
                  ## Отказ чтения cgroup остаётся диагностикой, код выхода берётся у npm.
                  - name: install
                    script:
                        - 'if printf "%s" "${RALPH_STALE_RUN:-}" | grep -Eqx "[0-9a-f]{40}"; then echo "⏭ npm ci пропущен: прогон устарел, HEAD уже ${RALPH_STALE_RUN}"; else node ci-timing.mts install; fi'

                  ## Один скрипт, а не список кубов: порядок и состав проверок — часть продукта
                  ## и живут в gate.mts. Разложи их здесь по кубам — и появится второй источник
                  ## правды, который разойдётся с локальным прогоном молча.
                  ## Обёртка печатает cpu.stat и после красного гейта, сохраняя его код.
                  - name: gate
                    script:
                        - 'if printf "%s" "${RALPH_STALE_RUN:-}" | grep -Eqx "[0-9a-f]{40}"; then echo "⏭ Гейт пропущен: прогон устарел, HEAD уже ${RALPH_STALE_RUN}"; else node ci-timing.mts gate; fi'

    ## Закрытие карточек, названных смердженным PR. Отдельный workflow, а не куб гейта:
    ## он МУТИРУЕТ карточки трекера, а гейт только проверяет код — у мутаций свой прогон,
    ## свой лог и свой отказ. Связь PR↔задача на площадке карточку не закрывает сама,
    ## поэтому сделанное иначе висит открытым, пока кто-нибудь не вспомнит.
    close-issues:
        tasks:
            - name: close-issues
              image: docker.io/library/node:24
              ## Блока `env` здесь НЕТ намеренно: `SOURCECRAFT_TOKEN` площадка отдаёт
              ## задаче сама, это её предопределённая переменная. Пока значение тянулось
              ## из `secrets`, его отсутствие валило ВЕСЬ прогон вместе с гейтом ещё на
              ## разборе конфига — три красных пуша в main. Предопределённая переменная
              ## снимает и это, и требование заводить секрет в каждом репозитории.
              cubes:
                  ## Без `npm ci`: скрипт живёт на встроенном стриппинге типов Node 24 и
                  ## не тянет ни одной зависимости. Ставить их ради одного запроса к форжу
                  ## значит платить минутой за каждый мердж.
                  - name: close
                    script:
                        - node close-merged-issues.mts
